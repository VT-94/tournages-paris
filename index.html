<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lieux de tournages à Paris</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="stylesheet" href="css/main.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10/ol.css"
    />
  </head>

  <body>
    <div id="map"></div>

    <div id="loading-banner">
      <span class="spinner"></span>
      <span id="loading-text">Chargement en cours…</span>
    </div>

    <div id="popup" class="ol-popup"></div>

    <div id="search-box">
      <input
        id="search-input"
        type="text"
        placeholder="Rechercher une adresse…"
        autocomplete="off"
      />
      <ul id="search-results"></ul>
    </div>

    <div id="basemap-panel"></div>
    <button id="basemap-btn" title="Changer le fond de carte">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
        <line x1="9" y1="3" x2="9" y2="18" />
        <line x1="15" y1="6" x2="15" y2="21" />
      </svg>
    </button>

    <button id="locate-btn" title="Me localiser">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>

    <div id="footer">
      Source :
      <a
        href="https://opendata.paris.fr/explore/dataset/lieux-de-tournage-a-paris/"
        target="_blank"
        rel="noopener"
        >Paris Open Data</a
      >
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
